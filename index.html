<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Target Academy — Learning Platform</title>
<meta name="description" content="Target Academy Coaching Centre, Manikpur, Gopalganj — notes, study material, online tests and results for students.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg?v=31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=75">
<script>
try{if(localStorage.getItem("ta_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(_){}
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <img class="sp-logo brand-logo" src="icon.svg?v=31" alt="">
    <div class="sp-name">TARGET ACADEMY</div>
    <div class="sp-sub">COACHING CENTRE</div>
    <div class="sp-line">Class 6th – 12th &nbsp;|&nbsp; DCECE • Paramedical</div>
    <div class="sp-by">By Ashutosh Kumar</div>
    <svg class="sp-book" viewBox="0 0 120 60" fill="none" stroke="#f2b705" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M60 14 C48 6, 30 4, 14 8 L14 46 C30 42, 48 44, 60 52 C72 44, 90 42, 106 46 L106 8 C90 4, 72 6, 60 14 Z"/><path d="M60 14 L60 52"/></svg>
    <div class="sp-tag">सपने देखो... <span class="sp-gold">लक्ष्य बनाओ...</span><br>हम साथ हैं...</div>
  </div>
</div>
<div class="layout">
  <aside id="sidebar">
    <div class="brand side-brand">
      <div class="logo"><img class="brand-logo" src="icon.svg?v=31" alt="Target Academy logo" data-zoom="icon.svg?v=31"></div>
      <div>
        <div class="brand-name">Target Academy</div>
        <div class="brand-sub">Learn • Practice • Grow</div>
      </div>
    </div>
    <nav id="sidenav"></nav>
    <div class="side-motivation">
      <div class="sm-t">Better Every Day 🏔️</div>
      <div class="sm-s">Small steps make big results!</div>
    </div>
  </aside>
  <div class="content">

<header id="topbar">
  <div class="brand">
    <div class="logo"><img class="brand-logo" src="icon.svg?v=31" alt="Target Academy logo" data-zoom="icon.svg?v=31"></div>
    <div>
      <div class="brand-name">Target Academy</div>
      <div class="brand-sub">Coaching Centre • Manikpur, Gopalganj</div>
    </div>
  </div>
  <div class="top-actions">
    <button id="themeBtn" class="ghost util-pill" type="button" title="Toggle theme" aria-label="Toggle dark mode"><span class="u-ic">🌙</span><span class="u-lb">Dark</span></button>
    <button id="bellBtn" class="ghost util-pill hidden" style="position:relative"><span class="u-ic">🔔</span><span class="u-lb">Notices</span><span id="bellBadge" class="hidden bellbadge"></span></button>
    <button id="logoutBtn" class="ghost util-pill util-out hidden"><span class="u-ic">🚪</span><span class="u-lb">Logout</span></button>
  </div>
</header>

<div id="pagehead" class="hidden"></div>
<main id="app">
  <div class="loading">Loading…</div>
</main>

<nav id="tabbar" class="hidden"></nav>
<div id="toast" class="hidden"></div>

<script>
(function(){
  const btn=document.getElementById("themeBtn");
  if(!btn)return;
  const sync=()=>{const d=document.documentElement.getAttribute("data-theme")==="dark";const ic=btn.querySelector(".u-ic"),lb=btn.querySelector(".u-lb");if(ic)ic.textContent=d?"☀️":"🌙";if(lb)lb.textContent=d?"Light":"Dark";if(!ic&&!lb)btn.textContent=d?"☀️":"🌙";btn.title=d?"Switch to Light Mode":"Switch to Dark Mode";};
  sync();
  btn.addEventListener("click",()=>{
    const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    if(next==="dark")document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    try{localStorage.setItem("ta_theme",next);}catch(_){}
    sync();
  });
})();
</script>
<script type="module" src="app.js?v=75"></script></script>

  </div>
</div>
</body>
</html>
